    <title>AI Advisor</title>
    <script>
      // Applies the stored or system-seeded theme before first paint so the
      // app never flashes the wrong theme (design.md D6.1).
      (function () {
        try {
          var stored = JSON.parse(
            localStorage.getItem('advaisor.theme') || 'null',
          );
          var theme =
            stored && stored.state && stored.state.theme
              ? stored.state.theme
              : 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
